<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paceman</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>
    <div class="bg-blob bg-blob-3"></div>
    <div class="bg-texture"></div>
    <div class="bg-vignette"></div>
  </div>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <div class="logo">PACEMAN</div>
        <nav class="nav">
          <button class="nav-btn active" data-page="home">Live Runs</button>
          <button class="nav-btn" data-page="favorites">Favorites</button>
          <button class="nav-btn" data-page="leaderboard">Leaderboard</button>
        </nav>
      </div>
      <div class="header-right">
        <div class="search-container">
          <input type="text" class="search-input" placeholder="Search player..." id="searchInput">
          <div class="search-dropdown" id="searchDropdown">
            <div class="search-section" id="searchRecents">
              <div class="search-section-title">Recent Searches</div>
              <div class="search-list" id="recentsList"></div>
            </div>
            <div class="search-section" id="searchResults">
              <div class="search-section-title">Players</div>
              <div class="search-list" id="resultsList"></div>
            </div>
          </div>
        </div>
        <div class="theme-switcher" id="themeSwitcher">
          <button class="theme-btn" id="themeBtn" title="Change theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 3a9 9 0 0 0 0 18z"></path>
            </svg>
          </button>
          <div class="theme-options" id="themeOptions"></div>
        </div>
      </div>
      <button class="streams-btn" id="streamsToggle" title="Show/hide stream dock">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 2L3 6v13h4v3h3l3-3h4l5-5V2H4zm16 9l-3 3h-5l-3 3v-3H6V4h14v7z"></path>
          <path d="M15 7h2v4h-2zM10 7h2v4h-2z"></svg>
        <span id="streamsCount">0</span>
      </button>
      <button class="refresh-btn" id="refreshBtn" title="Refresh">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"></path>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </header>

    <div class="dev-panel" id="devPanel">
      <div class="dev-panel-header">
        <h3>Dev Console</h3>
        <div class="dev-panel-actions">
          <button class="dev-btn" id="devClearCacheBtn">Clear Cache</button>
          <button class="dev-btn dev-btn-secondary" id="devClosePanelBtn">Hide</button>
        </div>
      </div>
      <div class="dev-console" id="devConsole"></div>
    </div>

    <main class="main-content">
      <div class="page active" id="page-home">
        <div class="page-header">
          <h1>Live Runs</h1>
          <div class="page-header-actions">
            <button class="filter-btn" id="filterBtn" title="Filters">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"></path>
                <path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path>
                <path d="M12 2v2"></path>
                <path d="M12 22v2"></path>
                <path d="M2 12h2"></path>
                <path d="M22 12h2"></path>
                <path d="M4.93 4.93l1.41 1.41"></path>
                <path d="M17.66 17.66l1.41 1.41"></path>
                <path d="M4.93 19.07l1.41-1.41"></path>
                <path d="M17.66 6.34l1.41-1.41"></path>
              </svg>
            </button>
            <div class="sort-controls" id="liveSort">
              <button class="sort-btn active" data-sort="stage">Stage</button>
              <button class="sort-btn" data-sort="time">Time</button>
            </div>
            <button class="auto-open-btn" id="autoOpenTwitchBtn" title="Auto-open Twitch streams">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
            </button>
          </div>
        </div>
        <div class="runs-list" id="runsList">
          <div class="loading">Loading live runs...</div>
        </div>
      </div>
      <div class="page" id="page-favorites">
        <div class="page-header">
          <h1>Favorites</h1>
          <div class="page-header-actions">
            <div class="search-container">
              <input type="text" class="search-input" placeholder="Search player to favorite..." id="favSearchInput">
              <div class="search-dropdown" id="favSearchDropdown">
                <div class="search-section" id="favSearchResults">
                  <div class="search-section-title">Players</div>
                  <div class="search-list" id="favResultsList"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="runs-list" id="favoritesList"></div>
      </div>
      <div class="page" id="page-profile">
        <div class="profile-header">
          <div class="profile-head-container" id="head3dContainer"></div>
          <div class="profile-info">
            <h1 id="profileName">Player Name</h1>
            <div class="profile-stats-row" id="profileStatsRow"></div>
            <div class="social-links" id="socialLinks"></div>
          </div>
          <button class="compare-btn" id="compareBtn" title="Compare with another player">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
          </button>
          <button class="favorite-btn" id="favoriteBtn" title="Add to favorites">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </button>
        </div>
        <div class="timeframe-tabs" id="profileTimeframes">
          <button class="timeframe-btn" data-tf="session">Session</button>
          <button class="timeframe-btn active" data-tf="daily">Daily</button>
          <button class="timeframe-btn" data-tf="weekly">Weekly</button>
          <button class="timeframe-btn" data-tf="monthly">Monthly</button>
          <button class="timeframe-btn" data-tf="lifetime">Lifetime</button>
        </div>
        <div class="session-stats" id="sessionStats"></div>
        <div class="profile-grid">
          <div class="profile-splits" id="profileSplits"></div>
          <div class="profile-runs">
            <h3 id="profileBestRunsTitle">Best Daily Runs</h3>
            <div class="runs-list-small" id="profileBestRuns"></div>
            <button class="view-all-btn" id="viewAllRunsBtn">View All Runs</button>
          </div>
        </div>
        <div class="profile-chart" id="profileChart" title="Completion times over time for this timeframe">
          <h3>Run History</h3>
          <div class="chart-controls">
            <select class="chart-stat-select" id="chartStatSelect">
              <option value="finish">Completion</option>
              <option value="nether">Nether</option>
              <option value="bastion">Bastion</option>
              <option value="fortress">Fortress</option>
              <option value="first_portal">Blind Portal</option>
              <option value="stronghold">Stronghold</option>
              <option value="end">End</option>
            </select>
            <button class="chart-toggle-btn" id="chartToggleBtn" title="Toggle chart visibility">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="chart-container" id="chartContainer"></div>
        </div>
        <div class="all-runs-modal" id="allRunsModal">
          <div class="modal-content">
            <div class="modal-header">
              <h2>All Runs</h2>
              <button class="modal-close" id="closeAllRuns">&times;</button>
            </div>
            <div class="runs-list" id="allRunsList"></div>
            <div class="pagination" id="runsPagination"></div>
          </div>
        </div>
        <div class="compare-panel" id="comparePanel">
          <div class="compare-column" id="compareCol1">
            <div class="compare-spacer"></div>
          </div>
          <div class="compare-divider"></div>
          <div class="compare-column" id="compareCol2">
            <div class="compare-search">
              <input type="text" class="search-input" placeholder="Search player to compare..." id="compareSearchInput">
              <button class="compare-clear-btn" id="compareClearBtn" title="Remove comparison player">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
              <div class="search-dropdown" id="compareSearchDropdown">
                <div class="search-section" id="compareSearchResults">
                  <div class="search-section-title">Players</div>
                  <div class="search-list" id="compareResultsList"></div>
                </div>
              </div>
            </div>
            <div class="compare-content" id="compareContent2"></div>
          </div>
        </div>
      </div>      

        <div class="page" id="page-leaderboard">
          <div class="page-header">
            <h1>Leaderboard</h1>
            <div class="timeframe-tabs" id="leaderboardTimeframes">
              <button class="timeframe-btn" data-tf="daily">Daily</button>
              <button class="timeframe-btn active" data-tf="weekly">Weekly</button>
              <button class="timeframe-btn" data-tf="monthly">Monthly</button>
              <button class="timeframe-btn" data-tf="lifetime">Lifetime</button>
            </div>
            <div class="lb-sort-toggle" id="lbSortToggle">
              <button class="lb-sort-btn active" data-sort="enters">Enters</button>
              <button class="lb-sort-btn" data-sort="avg">Avg Time</button>
            </div>
          </div>
          <div class="lb-grid" id="leaderboardGrid"></div>
        </div>
    </main>

    <footer class="app-footer" id="appFooter">
      <span>Powered by <a class="footer-link" href="https://paceman.gg" target="_blank" rel="noopener noreferrer">paceman.gg</a></span>
      <span class="footer-sep">·</span>
      <span>Original app by Specnr</span>
    </footer>

    <div class="filter-overlay" id="filterOverlay">
      <div class="filter-modal">
        <div class="modal-header">
          <h2>Filters</h2>
          <button class="modal-close" id="closeFilter">&times;</button>
        </div>
        <div class="filter-content">
          <div class="filter-group">
            <label>
              <input type="checkbox" id="filterFavoritesOnly">
              Show only favorites
            </label>
          </div>
          <div class="filter-group">
            <label>
              <input type="checkbox" id="filterStreamingOnly">
              Only show livestreaming players
            </label>
          </div>
          <div class="filter-group">
            <label>Maximum time per split (min:sec, empty = no limit)</label>
            <div class="filter-splits" id="filterSplits"></div>
          </div>
          <div class="filter-actions">
            <button class="btn-primary" id="applyFilters">Apply</button>
            <button class="btn-secondary" id="resetFilters">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <div class="twitch-dock" id="twitchDock">
      <div class="twitch-dock-bar">
        <span class="twitch-dock-title">Live Streams</span>
        <div class="twitch-dock-bar-actions">
          <button class="twitch-dock-layout" id="twitchDockLayout" title="Toggle side / bottom layout">&#9634;</button>
          <button class="twitch-dock-collapse" id="twitchDockCollapse" title="Hide dock">&#9662;</button>
        </div>
      </div>
      <div class="twitch-dock-body">
        <div class="twitch-dock-main" id="twitchDockMain"></div>
        <div class="twitch-dock-thumbs" id="twitchDockThumbs"></div>
      </div>
    </div>

    <div class="run-detail-overlay" id="runDetailOverlay">
      <div class="run-detail-modal">
        <div class="modal-header">
          <h2 id="runDetailTitle">Run</h2>
          <div class="modal-header-actions">
            <button class="modal-share" id="shareRunBtn" title="Copy share link">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                <polyline points="16 6 12 2 8 6"></polyline>
                <line x1="12" y1="2" x2="12" y2="15"></line>
              </svg>
            </button>
            <button class="modal-close" id="closeRunDetail">&times;</button>
          </div>
        </div>
        <div class="run-detail-body" id="runDetailBody">
          <div class="detail-splits" id="runDetailSplits"></div>
          <div class="detail-vod" id="runDetailVod" style="display:none">
            <h3>Twitch VOD</h3>
            <webview id="runVodWebview" src="about:blank" allowpopups style="width:100%;height:360px;border-radius:12px;background:#000"></webview>
            <div class="vod-controls">
              <button class="vod-seek-back" id="vodSeekBack" title="Back 5s">-5s</button>
              <button class="vod-speed" id="vodSpeed" title="Toggle 2x speed">1x</button>
              <button class="vod-seek-forward" id="vodSeekForward" title="Forward 5s">+5s</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="split-detail-panel" id="splitDetailPanel">
    <div class="split-detail-header">
      <h3 id="splitDetailTitle">Split Details</h3>
      <button class="split-detail-close" id="closeSplitDetail">&times;</button>
    </div>
    <div class="split-detail-controls">
      <button class="split-detail-sort" id="splitDetailSort" title="Flip sort order">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M3 12h12M3 18h6"></path>
        </svg>
      </button>
      <div class="split-detail-pagination" id="splitDetailPagination"></div>
    </div>
    <div class="split-detail-list" id="splitDetailList"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
